# Local hooks use the tool versions pinned in uv.lock (ruff, mypy) and the system gitleaks.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: scripts/uv.sh run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: scripts/uv.sh run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: scripts/uv.sh run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: large-files
        name: block files over 1MB
        entry: scripts/check_large_files.sh
        language: system
