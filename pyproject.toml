[project]
name = "smart-extractor"
version = "0.1.0"
description = "Extract schema-validated JSON from invoices, receipts and contracts using LLMs."
authors = [
    { name = "Moris Maor Zakay", email = "51758854+mnmz81@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "jinja2>=3.1.6",
    "mypy>=2.4.0",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
